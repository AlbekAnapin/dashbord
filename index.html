<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Дашборд качества данных ОВПО</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="top">
  <h1>📊 Качество данных ОВПО</h1>
  <label>Срез<select id="snapSel"></select></label>
  <label>Сравнить с<select id="cmpSel"></select></label>
  <span class="grow"></span>
  <button class="btn" id="uploadBtn">＋ Загрузить срез</button>
  <button class="btn ghost" id="themeBtn" title="Светлая / тёмная тема">Тема</button>
</header>
<nav class="tabs" id="tabs"></nav>
<main id="view"></main>
<div id="toast"></div>
<div class="loading" id="loading">Обработка…</div>
<input type="file" id="fileInput" multiple accept=".xlsx,.xls,.js,.json" hidden>
<input type="file" id="activeInput" accept=".xlsx,.xls" hidden>

<script src="assets/xlsx.full.min.js"></script>
<script src="data/bundle.js"></script>
<script src="assets/core.js"></script>
<script src="assets/charts.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
